plugins {
    id 'java'
}

version = "${project.mod_version}+${project.mc_tag}"
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    maven {
        name = 'Fabric'
        url = 'https://maven.fabricmc.net/'
    }
    maven {
        name = 'Minecraft'
        url = 'https://libraries.minecraft.net/'
    }
    mavenCentral()
}

sourceSets {
    compileOnlyStubs {
        java.srcDirs = ['src/compileOnly/java']
    }
    main {
        compileClasspath += sourceSets.compileOnlyStubs.output
    }
    test {
        compileClasspath += sourceSets.compileOnlyStubs.output
        runtimeClasspath += sourceSets.compileOnlyStubs.output
    }
}

dependencies {
    def externalCpJar = project.findProperty("coreprotectJar")
    if (externalCpJar != null && file(externalCpJar).exists()) {
        compileOnly files(externalCpJar)
    }
    compileOnly "net.fabricmc:fabric-loader:${project.loader_version}"
    compileOnly "net.fabricmc:sponge-mixin:0.17.4+mixin.0.8.7"
    compileOnly "io.github.llamalad7:mixinextras-fabric:0.4.1"
    compileOnly "com.mojang:brigadier:1.3.10"
    compileOnly "org.jdbi:jdbi3-core:3.45.1"

    compileOnlyStubsCompileOnly "net.fabricmc:fabric-loader:${project.loader_version}"
    compileOnlyStubsCompileOnly "com.mojang:brigadier:1.3.10"
    compileOnlyStubsCompileOnly "org.jdbi:jdbi3-core:3.45.1"
}

def targetJavaVersion = 25
tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    it.options.release = targetJavaVersion
    it.options.compilerArgs.add("-proc:none")
}

java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
}

jar {
    from("LICENSE")
}

tasks.named('test') {
    failOnNoDiscoveredTests = false
}

tasks.register('runLimiterTest', JavaExec) {
    dependsOn classes, testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'kr.harusarri.coreprotectmeltdown.LimiterTest'
    jvmArgs = ['-ea', '-Xmx128m']
}

check.dependsOn tasks.named('runLimiterTest')
