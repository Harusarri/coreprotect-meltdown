# Coreprotect-meltdown 설정 (UTF-8)
# 수정 후 /coreprotectmeltdown reload 또는 /co debug reload 로 즉시 적용합니다.
# /coreprotectmeltdown config 로 파일이 아닌 현재 적용값을 확인할 수 있습니다.
# 수량 단위는 아이템 개수가 아닌 CoreProtect 기록 건수입니다.
# 잘못된 값/모르는 키는 적용을 거부하고 기존 설정을 유지합니다.

# [전체 동작] true=보호 켜기, false=모든 차단 끄기 (큐/힙 보호도 꺼집니다)
enabled=true

# [지역별 자동화 제한] 각 차원의 가로/세로/높이 cell-size 블록 구역별 집계
# 지역 크기: 8~128. 지역을 바꾸면 이후 통계는 새 크기로 집계합니다.
cell-size=32
# 순간 허용량: 1~1000000. 시작 시 이만큼의 여유가 있으며 소모 후 아래 속도로 회복합니다.
region-burst=4000
# 초당 회복량: 1~1000000. 순간 입력에서는 burst가 추가로 허용됩니다.
region-per-second=400

# [플레이어 기록] 별도 지역 예산 + 서버 전체 플레이어 합산 예산
# 각각 1~1000000. 플레이어 한 명당 독립된 전역 예산이 아닙니다.
player-burst=20000
player-per-second=2000

# [서버 전체 자동화] 여러 공장/지역으로 분산된 입력도 합산해서 제한합니다.
# 각각 1~1000000.
global-burst=20000
global-per-second=5000

# [큐 상한] soft: 모든 자동화의 입력 한계. hard: 제한 대상 입력의 최종 한계.
# 기본값에서 일반 플레이어 증거는 큐/힙 제한으로 버리지 않습니다. 전체 큐 크기의 절대 상한이 아닙니다.
# soft: 1~100000. hard: soft보다 크고 200000 이하.
# 기존 DB 재시도는 보존하므로 CoreProtect 1.2의 처리 중인 최대 750건은 추가될 수 있습니다.
# 롤백/복원 내부 작업은 제외됩니다. 차단된 신규 기록은 조회/롤백할 수 없습니다.
queue-soft-limit=16000
queue-hard-limit=20000

# [대형 기록] 일반 직렬화 데이터 길이 제한: 256~1000000 글자
# 엔티티 상호작용 메타데이터는 바이트 길이 기준입니다.
max-payload-chars=32768

# [진단 메모리] 지역별 제한 상태 최대 16~65536개, 히트맵 최대 8~8192개
max-regions=4096
max-heatmap-cells=1024
# 활동 없는 지역의 제한 상태를 회수하는 시간: 10~86400초
region-idle-seconds=600
# debug.txt 자동 갱신 주기: 5~3600초. 반복 차단 경고는 콘솔에 출력하지 않습니다.
report-seconds=30

# [보조 힙 보호] 1초마다 점유율 검사. stop 이상에서 차단, resume 이하에서 해제.
# stop: 50~98(%). resume: 30 이상, stop 미만(%).
heap-stop-percent=88
heap-resume-percent=80

# [공장 위주 제한] true: 기계 행위자/자동 컨테이너 및 같은 셀의 자동화만 일반 제한
# false: 모든 자동화에 이전 지역/전역 제한 적용. 유저는 아래 별도 설정을 따릅니다.
factory-only=true
# false: 일반 플레이어 증거는 속도/지역수/payload/큐/힙 차단에서 모두 제외.
# 같은 유저/셀/몹 종류의 대량 반복 처치는 아래 기준으로 PLAYER_FACTORY에 분리합니다.
# PvP, 이름 붙은 몹, 소유자 정보가 있는 몹, 반려동물/주민/미확인 종류는 반복 처치 판정 제외.
# true로 명시하면 일반 유저에도 큐/힙/속도 제한을 다시 적용합니다.
limit-player-events=false
# 공장 입력과 엔티티 유지관리 입력은 큐가 이 값에 도달하면 차단합니다.
# 1~100000. queue-soft-limit와 비교해 작은 값 사용.
factory-queue-limit=1000
# 기계가 관측된 같은 cell-size 셀 안의 자동 이벤트(물/용암 등)를 공장으로 보는 시간.
# 1~3600초. 해당 셀에서도 유저 이름의 직접 입력에는 적용하지 않습니다.
factory-activity-seconds=30
# 정확히 일치하는 기계 actor 이름. 쉼표 구분, 공백 없이 소문자 #이름.
# 자동 컨테이너 기록은 이 목록 외에도 공장으로 분류합니다.
factory-actors=#piston,#hopper,#dispenser,#dropper

# [near/lookup 조회 보호] 1~60초. 별도 읽기 스레드 1개, 대기열 없이 처리.
# JDBC 문장 제한이며 드라이버의 취소 지원과 연결 대기 시간에 영향을 받습니다.
lookup-timeout-seconds=10
# near에 t:를 생략했을 때 기본 검색 기간. 0=기간 자동 추가 안 함, 최대31536000초.
# 명시한 t: 조건과 일반 lookup의 기간은 그대로 유지합니다.
near-default-seconds=86400

# [유저 이름 몹 공장 감지] 같은 유저/32블록 셀/일반 공장 몹 종류별 토큰 예산
# burst 64건 소진 후 초당 8건 회복. 초과하면 factory-activity-seconds 동안 공장 제한 적용.
# 지속 초과 중에는 공장 판정이 연장됩니다. 1~100000. 단순 위치만으로 유저를 차단하지 않습니다.
factory-kill-burst=64
factory-kill-per-second=8
